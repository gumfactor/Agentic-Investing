global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: '${ENVIRONMENT:-development}'

# Alertmanager configuration (add when you configure alerting)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # RQIS application metrics (pushed by rqis services via /metrics endpoint)
  - job_name: rqis_app
    static_configs:
      - targets: ['host.docker.internal:8000']
    honor_labels: true

  # TimescaleDB / PostgreSQL via postgres_exporter (add in Phase 3)
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Node / host metrics (add postgres_exporter sidecar in Phase 3)
  # - job_name: node
  #   static_configs:
  #     - targets: ['node-exporter:9100']
