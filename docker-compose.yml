# RQIS local development stack.
# All services are configured via environment variables from .env (see .env.example).
# Start: make up   Stop: make down   Wipe volumes: make clean

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infra/docker/Dockerfile.airflow
  image: rqis-airflow:2.8.1-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://rqis:${POSTGRES_PASSWORD}@timescaledb:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    PYTHONPATH: /opt/airflow/rqis
    # Pass through RQIS env vars so DAGs can access data sources
    DATABASE_URL: postgresql+psycopg2://rqis:${POSTGRES_PASSWORD}@timescaledb:5432/rqis
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    POLYGON_API_KEY: ${POLYGON_API_KEY:-}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/rqis/data:ro
    - ./signals:/opt/airflow/rqis/signals:ro
    - ./config:/opt/airflow/rqis/config:ro
    - ./scripts:/opt/airflow/rqis/scripts:ro
    - ./execution:/opt/airflow/rqis/execution:ro
    - ./risk:/opt/airflow/rqis/risk:ro
    - ./portfolio:/opt/airflow/rqis/portfolio:ro
    - ./reporting:/opt/airflow/rqis/reporting:ro
    - ./backtesting:/opt/airflow/rqis/backtesting:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    timescaledb:
      condition: service_healthy
  networks:
    - rqis

services:
  # ─── Primary time-series database ────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: rqis
      POSTGRES_USER: rqis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rqis -d rqis"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rqis

  # ─── Cache / session state ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rqis

  # ─── Object storage (S3-compatible) ─────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    networks:
      - rqis

  # ─── Experiment tracking ─────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-07-38Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET_RAW}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET_SNAPSHOTS}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET_MLFLOW}"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-rqis-raw}
      MINIO_BUCKET_SNAPSHOTS: ${MINIO_BUCKET_SNAPSHOTS:-rqis-snapshots}
      MINIO_BUCKET_MLFLOW: ${MINIO_BUCKET_MLFLOW:-mlflow}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - rqis

  mlflow:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://rqis:${POSTGRES_PASSWORD}@timescaledb:5432/mlflow
      --artifacts-destination s3://mlflow
      --host 0.0.0.0
      --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      timescaledb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - rqis

  # ─── Pipeline orchestration ──────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    # List form avoids YAML folding ambiguity. Single string inside bash -c
    # keeps the &&-chain unambiguous regardless of YAML scalar style.
    command:
      - bash
      - -c
      - "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@rqis.local} --password ${AIRFLOW_ADMIN_PASSWORD}"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ─── Metrics collection ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.49.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - rqis

  # ─── Log aggregation ─────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.4
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    networks:
      - rqis

  # ─── Dashboards ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - rqis

volumes:
  timescaledb_data:
  redis_data:
  minio_data:
  airflow_logs:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  rqis:
    driver: bridge
