[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqis"
version = "0.1.0"
description = "Robust Quant Investment System"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "signals*", "portfolio*", "execution*", "risk*", "backtesting*", "reporting*", "mcp_servers*", "strategy_registry*"]

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["data/tests", "signals/tests", "portfolio/tests", "execution/tests", "risk/tests", "backtesting/tests", "reporting/tests", "tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require live services (DB, broker)",
    "slow: marks tests that take >5 seconds",
]

# ─── Ruff (linter + formatter) ───────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["data", "signals", "portfolio", "execution", "risk", "backtesting", "reporting", "strategy_registry"]

# ─── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", "infra/"]
