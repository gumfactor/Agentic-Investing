[alembic]
# Path to migration scripts
script_location = infra/db/migrations

# Template for new revision filenames
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with this value when importing env.py
prepend_sys_path = .

# Truncate long revision slugs in filenames
truncate_slug_length = 40

# SQLAlchemy connection string.
# NOT set here — env.py loads DATABASE_URL from the environment (or .env)
# and calls config.set_main_option("sqlalchemy.url", ...) at runtime.
# Credentials must never be committed to this file (see C5 in PRD.md).
sqlalchemy.url = not-set-see-env-py

[post_write_hooks]
# Run ruff on new migration files
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
